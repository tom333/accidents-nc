name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Check code formatting (ruff)
        run: |
          uv run ruff check src/ tests/ dagster_pipeline/ apps/ --output-format=github
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ -v --cov=src/accidents --cov-report=term --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  validation-tests:
    name: Phase Validation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run Phase 1 validation
        run: uv run python tests/test_phase1_validation.py
      
      - name: Run Phase 2 validation
        run: uv run python tests/test_phase2_validation.py
      
      - name: Run Phase 3 validation
        run: uv run python tests/test_phase3_validation.py
      
      - name: Run Phase 4 validation
        run: uv run python tests/test_phase4_validation.py
      
      - name: Run Phase 5 validation
        run: uv run python tests/test_phase5_validation.py

  summary:
    name: Tests Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, validation-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Lint failed"
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.validation-tests.result }}" != "success" ]; then
            echo "❌ Validation tests failed"
            exit 1
          fi
          echo "✅ All tests passed!"
