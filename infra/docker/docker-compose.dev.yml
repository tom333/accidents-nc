version: '3.8'

services:
  # PostgreSQL - Catalog DuckLake
  postgres:
    image: postgres:16-alpine
    container_name: accidents-postgres
    environment:
      POSTGRES_DB: accidents
      POSTGRES_USER: accidents
      POSTGRES_PASSWORD: accidents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accidents"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - accidents-network
  
  # MinIO - S3 Storage local
  minio:
    image: minio/minio:latest
    container_name: accidents-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console Web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - accidents-network
  
  # MinIO init (crée le bucket)
  minio-init:
    image: minio/mc:latest
    container_name: accidents-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo '🔧 Configuration MinIO...';
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/accidents;
      mc anonymous set download local/accidents;
      echo '✅ Bucket accidents créé avec succès!';
      exit 0;
      "
    networks:
      - accidents-network

volumes:
  postgres_data:
    name: accidents-postgres-data
  minio_data:
    name: accidents-minio-data

networks:
  accidents-network:
    name: accidents-network
    driver: bridge
