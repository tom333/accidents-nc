apiVersion: apps/v1
kind: Deployment
metadata:
  name: accidents-api
  labels:
    app: accidents-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accidents-api
  template:
    metadata:
      labels:
        app: accidents-api
    spec:
      containers:
      - name: api
        image: accidents-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: accidents-config
              key: S3_ENDPOINT
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "0.5"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: accidents-api-service
spec:
  selector:
    app: accidents-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
