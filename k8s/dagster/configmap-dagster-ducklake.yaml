apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-ducklake-config
  namespace: dagster
data:
  DUCKLAKE_DB_ALIAS: "accidents_ducklake"
  AWS_REGION: "us-east-1"
  # DSN Postgres pour catalogue DuckLake (service datalab)
  DUCKLAKE_DATABASE_URL: "dbname=data host=postgresql.datalab.svc.cluster.local user=data"
  # Endpoint RustFS public (tgu.ovh)
  AWS_ENDPOINT_URL: "http://rustfs.ia-lab.svc.cluster.local:9000"
  DUCKLAKE_DATA_PATH: "s3://accidents-bucket/ducklake/"
  MLFLOW_TRACKING_URI: "http://mlflow.ia-lab.svc.cluster.local:5000"
  MLFLOW_S3_ENDPOINT_URL: "http://rustfs.ia-lab.svc.cluster.local:9000"
