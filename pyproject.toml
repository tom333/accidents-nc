[project]
name = "accidents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.42.37",
    "dagster>=1.8.0",
    "dagster-k8s>=0.25.0",
    "dagster-postgres>=0.25.0",
    "dagster-webserver>=1.8.0",
    "dagster-dg-cli>=1.12.12",
    "duckdb>=1.3.0",
    "geopandas>=1.1.2",
    "geopy>=2.4.1",
    "joblib==1.5.3",
    "mlflow-skinny==3.8.1",
    "numpy>=2.4.1",
    "osmnx==2.0.7",
    "pandas==2.3.3",
    "polars==1.29.0",
    "pyarrow==19.0.0",
    "python-dotenv==1.2.1",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "pytorch-tabnet==4.1.0",
    "scikit-learn==1.8.0",
    "scipy>=1.14.1",
    "shapely==2.1.2",
    "deepchecks>=0.19.1",
    "catboost==1.2.8",
    "lightgbm==4.6.0",
    "optuna==4.7.0",
    "optuna-integration==4.7.0",
    "xgboost==3.1.3",
    "imblearn==0.0",
    "matplotlib==3.10.8",
    "shap>=0.49.1",
    "setuptools>=82.0.0",
    "evidently>=0.7.20",
    "dagster-mlflow>=0.28.14",
    "pre-commit>=4.5.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# 2. On force uv à utiliser cet index uniquement pour ces paquets spécifiques
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[project.optional-dependencies]

dev = [
    "pytest==8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.1",
    "marimo[recommended]>=0.19.4",
    "pre-commit>=4.0.0",
]
streamlit = [
    "streamlit>=1.53.1",
    "streamlit-folium>=0.26.1",
    "folium>=0.20.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*"]
exclude = ["k8s*", "data*", "archive*", "exploration*", "catboost_info*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration tests (require DuckLake)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/accidents"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/*" = ["B018"]  # useless expression

[tool.marimo.runtime]
pythonpath = ["."]
